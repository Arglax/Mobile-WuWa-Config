[StableConfigC DeviceProfile]
Cvars=r.Android.DisableVulkanSupport=0
Cvars=r.Mobile.HighQualityMaterial=1
Cvars=r.imp.SSMbScaleLod0=0.00
Cvars=r.imp.SSMbScaleLod1=0.00
CVars=wp.Runtime.LoadingRangeScale=0.85
CVars=wp.Runtime.PlannedLoadingRangeScale=1.05
CVars=r.KuroFI.InternalResolutionScale=0.5
; -- Scalability Groups --
CVars=sg.ViewDistanceQuality=0
CVars=sg.AntiAliasingQuality=0
CVars=sg.ShadowQuality=0
CVars=sg.PostProcessQuality=0
CVars=sg.TextureQuality=3
CVars=sg.EffectsQuality=0
CVars=sg.FoliageQuality=0
CVars=sg.ShadingQuality=1
; -- Anti Thermal Throttling --
CVars=r.Mobile.EnergySavingFrameInterpolation=0
CVars=r.DontLimitOnBattery=1

