r.Shadow.MaxCSMResolution=256
r.Shadow.DistanceScale=0.8
r.Shadow.RadiusThreshold=0.03
r.Shadow.PerObjectResolutionMax=64
r.Shadow.PerObjectResolutionMin=32
r.Shadow.AllShadowDrawcallMax=300
r.MeshDrawCommands.ShadowPerBatchDrawcallMax=140
