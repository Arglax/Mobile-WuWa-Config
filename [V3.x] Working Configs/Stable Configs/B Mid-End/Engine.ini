r.Mobile.DisableLocalLightSpecularDistance=15000000
r.Kuro.ToonOutlineDrawDistanceMobile=350
r.Kuro.ToonEyeTransparentDrawDistanceMobile=150
r.Kuro.ToonFaceShadowMeshDrawDistanceMobile=150

[/Script/Engine.StreamingSettings]
r.TextureStreaming=1
r.Streaming.FullyLoadUsedTextures=0        
r.Streaming.UseBackgroundThreadPool=1      
r.Streaming.UseMaterialData=1      
