name: Strip Forbidden CVars

on:
  push:
    branches: [main]
    paths:
      - "\\[V3.x\\] Working Configs/**"
      - ".github/forbidden_cvars.txt"
      - ".github/scripts/strip_forbidden_cvars.py"
  pull_request:
    paths:
      - "\\[V3.x\\] Working Configs/**"
      - ".github/forbidden_cvars.txt"
  workflow_dispatch:

jobs:
  scan-and-clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run forbidden CVar scan
        id: scan
        run: |
          python3 .github/scripts/strip_forbidden_cvars.py
        continue-on-error: true

      - name: Fail PR if forbidden CVars were found
        if: github.event_name == 'pull_request' && steps.scan.outcome == 'failure'
        run: |
          echo "::error::Forbidden CVars were found in this PR. See the log above for details. Remove them before merging (or they will be auto-stripped after merge to main)."
          exit 1

      - name: Commit cleaned files
        if: github.event_name != 'pull_request' && steps.scan.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "[V3.x] Working Configs"
          git commit -m "chore: auto-strip forbidden CVars"
          git push