#this should auto release the zip file for all working configs whenever there's an update

name: Create ZIPRelease

on:
  workflow_dispatch:
    inputs:
    tag:
        description: "Release tag (e.g. v3-5)"
        required: true
        default: "v3-5"
      title:
        description: "Release title"
        required: true
        default: "Version 3.5 — Stable Release"
      notes:
        description: "Release notes (Markdown)"
        required: true
        default: |
          ## High Visuals Configs

          | Config | Description |
          |---|---|
          | HighVisual | High quality characters and textures, balanced performance |
          | Z_Experimental | Alternative to HighVisual if you experience issues |

          If HighVisual gives you trouble, try Z_Experimental instead.

          ## Stable Configs

          Configs updated for Wuthering Waves v3.5.
          
          | Config | Target Device |
          |---|---|
          | Stable_A | High-end devices |
          | Stable_B | Mid-end devices |
          | Stable_C | Low-end devices |

          ## Performance Configs

          Compilation of all performance configs compressed.

          | Config | Description |
          |---|---|
          | Config_1 | High quality characters and textures, no shadows, no/minimal reflections |
          | Config_2 | Minimal config (near-vanilla), high TAA |
          | Potato Config | For low-end phones struggling to play WuWa |
        
          All configs are patched with the bike fix for frame-gen enabled gameplay.
          Credits for the fix goes to k4irzw67.
          🙏 Thanks to everyone who tested and reported issues.

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build release zip
        run: |
          cd "[V3.x] Working Configs"
          zip -r "../Mobile-WuWa-Config-${{ inputs.tag }}.zip" . -x "*.DS_Store"
          cd ..
          echo "=== Zip contents ==="
          unzip -l "Mobile-WuWa-Config-${{ inputs.tag }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          body: ${{ inputs.notes }}
          files: Mobile-WuWa-Config-${{ inputs.tag }}.zip