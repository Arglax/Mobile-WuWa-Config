name: Create ZIPRelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3-5)"
        required: true
        default: "v3-5"
      title:
        description: "Release title"
        required: true
        default: "Version 3.5 — Stable Release"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release zip
        run: |
          zip -r "Mobile-WuWa-Config-${{ inputs.tag }}.zip" "[V3.x] Working Configs" "Community Configs" -x "*.DS_Store"
          zip -j "Mobile-WuWa-Config-${{ inputs.tag }}.zip" ".github/custom-metadata.txt"
          echo "=== Zip contents ==="
          unzip -l "Mobile-WuWa-Config-${{ inputs.tag }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          body_path: .github/RELEASE_NOTES.md
          files: Mobile-WuWa-Config-${{ inputs.tag }}.zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-auth requests

      - name: Send FCM notification
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        # Notice we use inputs.tag here instead of github.event.release.tag_name
        run: python .github/scripts/send_fcm.py "${{ inputs.tag }}"