name: Create ZIPRelease
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v3-5)"
        required: true
        default: "v3-5"
      title:
        description: "Release title"
        required: true
        default: "Version 3.5 — Stable Release"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build release zip
        run: |
          cd "[V3.x] Working Configs"
          zip -r "../Mobile-WuWa-Config-${{ inputs.tag }}.zip" . -x "*.DS_Store"
          cd ..
          echo "=== Zip contents ==="
          unzip -l "Mobile-WuWa-Config-${{ inputs.tag }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          body_path: .github/RELEASE_NOTES.md
          files: Mobile-WuWa-Config-${{ inputs.tag }}.zip